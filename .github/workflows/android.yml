name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install pinned SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'
      # PR builds use a disposable debug key. Stable personal signing is opt-in
      # for trusted main/manual builds only, never exposed to a pull request.
      - name: Prepare optional personal signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.TRIP_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.TRIP_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TRIP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TRIP_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            [[ -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]] || { echo 'All four signing secrets are required.'; exit 1; }
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/trip-companion.jks"
            echo "TRIP_KEYSTORE_PATH=$RUNNER_TEMP/trip-companion.jks" >> "$GITHUB_ENV"
          fi
      - name: Test, lint and build APK
        env:
          GOOGLE_MAPS_API_KEY: ${{ github.event_name != 'pull_request' && secrets.GOOGLE_MAPS_API_KEY || '' }}
          TRIP_STORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.TRIP_STORE_PASSWORD || '' }}
          TRIP_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.TRIP_KEY_ALIAS || '' }}
          TRIP_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.TRIP_KEY_PASSWORD || '' }}
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Enable KVM for the dedicated test emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test native editors and window resizing
        # Keep configuration identical: the emulator step rebuilds the app APK.
        env:
          GOOGLE_MAPS_API_KEY: ${{ github.event_name != 'pull_request' && secrets.GOOGLE_MAPS_API_KEY || '' }}
          TRIP_STORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.TRIP_STORE_PASSWORD || '' }}
          TRIP_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.TRIP_KEY_ALIAS || '' }}
          TRIP_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.TRIP_KEY_PASSWORD || '' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: gradle --no-daemon connectedDebugAndroidTest
      - name: Verify final APK and report public signing certificate
        env:
          GOOGLE_MAPS_API_KEY: ${{ github.event_name != 'pull_request' && secrets.GOOGLE_MAPS_API_KEY || '' }}
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/trip-apk-package.txt"
          head -n 1 "$RUNNER_TEMP/trip-apk-package.txt"
          if [[ -n "${TRIP_KEYSTORE_PATH:-}" ]]; then
            echo 'Personal signing configured for this trusted build.'
          else
            echo 'Disposable debug signing; this certificate can change between builds.'
          fi
          if [[ -n "$GOOGLE_MAPS_API_KEY" ]]; then
            echo 'Google Maps API key supplied to this trusted build; its value is not logged.'
          else
            echo 'Keyless build; live Maps and Places lookup are unavailable.'
          fi
      - name: Upload installable APK
        uses: actions/upload-artifact@v5
        with:
          name: trip-companion-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: android-test-reports-${{ github.run_number }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/test-results/testDebugUnitTest/
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
      - name: Remove temporary signing key
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/trip-companion.jks" ]]; then
            rm -- "$RUNNER_TEMP/trip-companion.jks"
          fi
